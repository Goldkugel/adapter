[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adapter"
version = "1.0.5"
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.0.5"
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
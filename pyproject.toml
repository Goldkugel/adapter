[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adapter"
version = "1.2.0"
requires-python = ">=3.9"
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.1.0",
    "owlready2",
    "pandas",
    "pydantic>=2",
    "pyyaml",
    "rdflib"
]

[tool.setuptools]
packages = [
    "adapter",
    "adapter.hpo",
    "adapter.sct",
    "adapter.umls"
]

[tool.setuptools.package-dir]
"adapter" = "src"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
# The tests live next to the code as <Name>Test.py and are run from the
# repository root (plain "pytest"), where ./config/config.yaml is found.
testpaths    = ["src"]
python_files = ["*Test.py"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adapter"
version = "1.6.0"
requires-python = ">=3.9"
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.7.0",
    "owlready2",
    "pandas",
    "pydantic>=2",
    "pyyaml",
    "rdflib"
]

[tool.setuptools]
packages = [
    "adapter",
    "adapter.hpo",
    "adapter.sct",
    "adapter.umls"
]

[tool.setuptools.package-dir]
"adapter" = "src"

[project.optional-dependencies]
# pytest-cov reports the test coverage in CI.
test = ["pytest>=7", "pytest-cov"]

[tool.pytest.ini_options]
# The tests live in tests/ as <Name>Test.py and are run from the
# repository root (plain "pytest"), where ./config/config.yaml is found.
# They import the installed package ("adapter"), so install it first
# (pip install -e ".[test]" for development); tests/ is not part of it.
testpaths    = ["tests"]
python_files = ["*Test.py"]

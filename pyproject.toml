[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adapter"
version = "1.2.0"
requires-python = ">=3.9"
dependencies = [
    "logger @ git+https://github.com/Goldkugel/logger.git@v1.1.0",
    "owlready2",
    "pandas",
    "pydantic>=2",
    "pyyaml",
    "rdflib"
]

[tool.setuptools]
packages = [
    "adapter",
    "adapter.hpo",
    "adapter.sct",
    "adapter.umls"
]

[tool.setuptools.package-dir]
"adapter" = "src"

[project.optional-dependencies]
# pytest 7 is the first version with the `pythonpath` setting below.
test = ["pytest>=7"]

[tool.pytest.ini_options]
# The tests live in tests/ as <Name>Test.py and are run from the
# repository root (plain "pytest"), where ./config/config.yaml is found.
# They import the package as "src", so the repository root is put on
# sys.path; tests/ is not part of the installed package.
testpaths    = ["tests"]
python_files = ["*Test.py"]
pythonpath   = ["."]
